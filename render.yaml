# Despliegue en Render (https://render.com) mediante Blueprint.
# Las claves (sync: false) se introducen en el panel de Render, NUNCA aquí.
# FREE_ONLY=1: el servidor solo usa proveedores con nivel gratuito (OpenAI y Claude quedan ocultos).
services:
  - type: web
    name: jarvis-4
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/jarvis-4-iphone-dev-yit5er
    buildCommand: "node --version"
    startCommand: "node server/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: FREE_ONLY
        value: "1"
      - key: AI_PROVIDER
        value: github
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: DAILY_REQUEST_LIMIT
        value: "300"
      # Proveedores gratuitos (rellena solo los que uses)
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # De pago (se conserva la integración; inactiva mientras FREE_ONLY=1)
      - key: OPENAI_API_KEY
        sync: false
      - key: JARVIS_ACCESS_CODE
        sync: false
